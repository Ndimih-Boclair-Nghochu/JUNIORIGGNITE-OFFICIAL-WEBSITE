# JuniorIgnite — nginx site config for a single free-tier EC2 instance.
# Serves the built SPA + the installer, and proxies /api to the Node backend.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/juniorignite.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your-domain www.your-domain;   # <-- change

    root /var/www/juniorignite;                # where dist/ is uploaded
    index index.html;

    # Installer downloads are large; don't buffer them through memory and let
    # clients resume interrupted downloads (important on slow connections).
    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Accept-Ranges bytes;
        sendfile on;
        tcp_nopush on;
        # The .exe is immutable per release — cache it hard.
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log /var/log/nginx/juniorignite-downloads.log;
    }

    # API -> Node (systemd service on 127.0.0.1:4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: refreshing /about or /founder must serve index.html,
    # otherwise those routes 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening
    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Don't waste CPU gzipping an already-compressed installer.
    gzip_disable "msie6";
    client_max_body_size 2m;
}
